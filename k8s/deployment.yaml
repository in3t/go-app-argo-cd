apiVersion: apps/v1
kind: Deployment

metadata:
  name: go-app
  namespace: go-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: go-app

  template:
    metadata:
      labels:
        app: go-app

    spec:
      containers:
      - name: go-app
        image: docker.io/in3t/go-app:latest

        ports:
        - containerPort: 8080

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "256Mi"

        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
