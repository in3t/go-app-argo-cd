apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: go-argo-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/in3t/go-app-argo-cd.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: go-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
    - CreateNamespace=true